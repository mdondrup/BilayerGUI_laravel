name: Laravel CD Testing

on:
  push:
    branches:
      - testing

permissions:
  contents: read

concurrency:
  group: testing-deploy
  cancel-in-progress: true

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Laravel CI to pass
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          # IMPORTANT: Use the Job Name from your CI file, not the Workflow Name
          check-name: 'tests' 
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10 # Seconds between polls
          allowed-conclusions: success


  deploy:
    runs-on: ubuntu-latest
    needs: wait-for-ci
    environment: testing
    timeout-minutes: 30

    env:
      TEST_USER: ${{ secrets.TEST_USER }}
      TEST_HOST: ${{ secrets.TEST_HOST }}
      TEST_PATH: ${{ secrets.TEST_PATH }}
      SSH_OPTS: -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, xml, curl, gd, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Configure SSH
        env:
          TEST_SSH_KEY: ${{ secrets.TEST_SSH_KEY }}
          TEST_KNOWN_HOSTS: ${{ secrets.TEST_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TEST_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$TEST_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Create target directory if it doesn't exist
        run: |
          ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} <<EOF
          set -e
          mkdir -p '${TEST_PATH}'
          chgrp www-data '${TEST_PATH}'
          chmod g+s '${TEST_PATH}'
          EOF
          

      - name: Sync application files
        run: |
          rsync -rlz --delete --omit-dir-times --no-owner --no-group --no-perms \
            --exclude='.git/' \
            --exclude='.devcontainer/' \
            --exclude='Python/config.json' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='public/robots.txt' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='BilayerData/' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='database/testing/' \
            --exclude='dev-tools/' \
            -e "ssh ${SSH_OPTS}" \
            ./ ${TEST_USER}@${TEST_HOST}:${TEST_PATH}/

      - name: Install production dependencies and optimize
        run: |
          ssh ${SSH_OPTS} ${TEST_USER}@${TEST_HOST} <<EOF
          set -e
          cd '${TEST_PATH}'
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan view:cache
          if [ ! -L public/storage ]; then
            php artisan storage:link
          fi
          EOF
